services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_IDS: ${ADMIN_IDS:-}
      GIFT_RADAR_ADMIN_IDS: ${GIFT_RADAR_ADMIN_IDS:-}
      PORTALS_API_KEY: ${PORTALS_API_KEY:-}
      TONNEL_API_KEY: ${TONNEL_API_KEY:-}
      MRKT_API_KEY: ${MRKT_API_KEY:-}
      DATA_DIR: /app/data
      GIFT_RADAR_LOG_DIR: /app/data/logs
      GIFT_RADAR_SCAN_SECONDS: ${GIFT_RADAR_SCAN_SECONDS:-300}
      GIFT_RADAR_RETENTION_DAYS: ${GIFT_RADAR_RETENTION_DAYS:-90}
    volumes:
      - ./data:/app/data
    stop_signal: SIGINT
    stop_grace_period: 45s
