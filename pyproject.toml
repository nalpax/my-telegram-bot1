[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gift-radar"
version = "0.1.0"
description = "Read-only Telegram collectible gift analytics"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot==22.5", "python-dotenv==1.0.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
gift-radar = "gift_radar.cli:main"

[tool.setuptools.packages.find]
include = ["gift_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
